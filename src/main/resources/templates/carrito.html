<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Carrito - Milys</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <h1 class="mb-4 fw-bold"><span class="text-primary">Tu Carrito</span> de Compras</h1>
        <div class="card shadow-sm p-4">
            <table class="table align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th class="text-center">Cantidad</th>
                        <th>Subtotal</th>
                        <th class="text-center">Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${carrito}">
                        <td class="fw-bold" th:text="${item.producto.nombre}">Nombre</td>
                        <td th:text="${'$ ' + #numbers.formatDecimal(item.producto.precio, 1, 2)}">$0.00</td>
                        <td class="text-center" th:text="${item.cantidad}">1</td>
                        <td class="text-success fw-bold" th:text="${'$ ' + #numbers.formatDecimal(item.total, 1, 2)}">$0.00</td>
                        <td class="text-center">
                            <a th:href="@{'/carrito/eliminar/' + ${item.producto.id}}" class="btn btn-danger btn-sm">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="d-flex justify-content-between align-items-center mt-4 p-3 bg-light rounded">
                <h3 class="fw-bold mb-0">Total: <span class="text-success" th:text="${'$ ' + #numbers.formatDecimal(total, 1, 2)}">$0.00</span></h3>
                <a href="/" class="btn btn-primary">Seguir comprando</a>
            </div>
        </div>
    </div>
</body>
</html>
