<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Producto - Milys</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h1 class="text-center mb-4 fw-bold text-primary">Formulario de Producto</h1>
            <form th:action="@{/guardar}" th:object="${producto}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{rutaImage}">
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-semibold">Nombre:</label>
                    <input type="text" th:field="*{nombre}" id="nombre" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="precio" class="form-label fw-semibold">Precio:</label>
                    <input type="number" th:field="*{precio}" id="precio" step="0.01" min="0" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label for="fileinput" class="form-label fw-semibold">Selecciona una imagen:</label>
                    <input type="file" name="fileinput" id="fileinput" class="form-control" accept="image/*">
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Guardar</button>
                    <a href="/lista" class="btn btn-outline-secondary">Volver</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
