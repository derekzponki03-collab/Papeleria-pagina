<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administrar Productos - Milys</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-dark fw-bold">Lista de Productos (Admin)</h1>
            <div>
                <a href="/nuevo" class="btn btn-success me-2">+ Crear Nuevo Producto</a>
                <a href="/" class="btn btn-outline-secondary">Ver página principal</a>
            </div>
        </div>
        <div class="card shadow-sm">
            <table class="table table-striped align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Imagen</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="producto : ${productos}">
                        <td th:text="${producto.id}">1</td>
                        <td class="fw-bold" th:text="${producto.nombre}">Nombre</td>
                        <td th:text="${'$ ' + #numbers.formatDecimal(producto.precio, 1, 2)}">$0.00</td>
                        <td>
                            <img th:if="${producto.rutaImage != null}" th:src="@{'/imgs/' + ${producto.rutaImage}}" class="img-thumbnail" style="width: 60px; height: 60px; object-fit: contain;">
                        </td>
                        <td class="text-center">
                            <a th:href="@{'/editar/' + ${producto.id}}" class="btn btn-warning btn-sm me-2">Editar</a>
                            <a th:href="@{'/eliminar/' + ${producto.id}}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar producto?')">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
